<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>nest · écrire au bailleur</title>
<style>
  /* Page pont : le message arrive dans le fragment (#…), jamais envoyé au serveur. */
  :root {
    --fond: #f5f6f8; --surface: #fff; --encre: #16203a; --doux: #5b6478;
    --trait: #dde1e8; --plaque: #1f3a6b; --liseré: #2f7d5b;
  }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --fond: #0f1420; --surface: #171e2e; --encre: #e7ebf3;
            --doux: #98a2b8; --trait: #2a3348; --plaque: #3f64a8; --liseré: #4cae86; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--encre);
         font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding-inline: 16px;
         padding-block: calc(24px + env(safe-area-inset-top, 0px)) 40px; display: grid; gap: 16px; }
  .plaque { justify-self: start; background: var(--plaque); color: #fff; border: 2px solid #fff;
            outline: 2px solid var(--liseré); border-radius: 6px; padding: 3px 10px;
            font-weight: 700; font-size: 12px; letter-spacing: .06em; }
  h1 { font-size: 20px; margin: 0; text-wrap: balance; }
  .message { background: var(--surface); border: 1px solid var(--trait); border-radius: 10px;
             padding: 14px; white-space: pre-wrap; margin: 0; font: inherit; }
  .principal { display: block; text-align: center; background: var(--plaque); color: #fff;
               text-decoration: none; font-weight: 600; padding: 14px; border-radius: 12px; }
  .secondaires { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; font-size: 15px; }
  .secondaires a, .secondaires button { color: var(--plaque); background: none; border: 0; padding: 0;
             font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .etat { text-align: center; color: var(--doux); font-size: 14px; min-height: 1.5em; margin: 0; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--liseré); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="plaque">NEST</div>
  <h1 id="titre">Écrire au bailleur</h1>
  <pre class="message" id="message">Chargement du message…</pre>
  <a class="principal" id="ecrire" href="https://www.leboncoin.fr">Copier le message et écrire au bailleur</a>
  <p class="etat" id="etat" aria-live="polite">Sur Leboncoin, il te restera à coller puis envoyer.</p>
  <div class="secondaires">
    <button type="button" id="copier">Copier seulement</button>
    <a id="annonce" href="https://www.leboncoin.fr">Voir l'annonce</a>
    <button type="button" id="signaler" hidden>Signaler une arnaque</button>
  </div>
</main>
<script>
  // Fragment = base64url(deflate brut(JSON {i: id annonce, c: catégorie, t: titre, m: message,
  //            s: canal ntfy de signalement, u: URL de l'annonce hors Leboncoin})).
  async function lire() {
    const b64 = location.hash.slice(1).replace(/-/g, "+").replace(/_/g, "/");
    const octets = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const flux = new Blob([octets]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return JSON.parse(await new Response(flux).text());
  }
  function copier(texte) {
    return navigator.clipboard.writeText(texte).then(() => true, () => {
      const r = document.createRange(); r.selectNodeContents(document.getElementById("message"));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); return false;
    });
  }
  lire().then(({ i, c, t, m, s, u }) => {
    document.getElementById("titre").textContent = t || "Écrire au bailleur";
    document.getElementById("message").textContent = m;
    const etat = document.getElementById("etat");
    if (u) {
      // Hors Leboncoin (Gens de Confiance) : pas de formulaire direct, on ouvre la fiche.
      document.getElementById("ecrire").href = u;
      document.getElementById("ecrire").textContent = "Copier le message et ouvrir l'annonce";
      document.getElementById("annonce").href = u;
      etat.textContent = "Sur la fiche, ouvre la messagerie du propriétaire, puis colle et envoie.";
    } else {
      document.getElementById("ecrire").href = `https://www.leboncoin.fr/reply/${i}`;
      document.getElementById("annonce").href = `https://www.leboncoin.fr/ad/${c || "locations"}/${i}`;
    }
    // Pas de preventDefault : le lien suit son cours (ouvre l'app Leboncoin si installée).
    document.getElementById("ecrire").addEventListener("click", () => { copier(m); });
    // Signalement : nest relève ce canal à chaque passage et bloque le compte pour toujours.
    const boutonSignal = document.getElementById("signaler");
    if (s) {
      boutonSignal.hidden = false;
      let armé = false;
      boutonSignal.addEventListener("click", async () => {
        if (!armé) { armé = true; boutonSignal.textContent = "Confirmer : c'est une arnaque"; return; }
        try {
          const r = await fetch(`https://ntfy.sh/${s}`, { method: "POST", body: `arnaque ${i}` });
          if (!r.ok) throw new Error(r.status);
          boutonSignal.hidden = true;
          etat.textContent = "Signalé : ce compte sera bloqué au prochain passage de nest.";
        } catch {
          etat.textContent = "Signalement impossible pour l'instant : réessaie dans un moment.";
        }
      });
    }
    document.getElementById("copier").addEventListener("click", async () => {
      etat.textContent = (await copier(m)) ? "Message copié." : "Texte sélectionné : copie-le à la main.";
    });
  }).catch(() => {
    document.getElementById("message").textContent = "Lien incomplet : rouvre-le depuis la notification.";
  });
</script>
</body>
</html>
